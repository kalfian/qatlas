# QAtlas — production-style docker-compose (docs/12-deployment.md, option A).
#
#   cp deploy/.env.example deploy/.env      # fill the CHANGE_ME values
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml --profile demo up -d   # + demo target app
#
# Postgres is NOT published on the host. To reach it from the host for
# maintenance use `docker compose exec postgres psql -U qatlas qatlas`, or add a
# docker-compose.override.yml with  ports: ["127.0.0.1:55433:5432"].
name: qatlas

x-qatlas-env: &qatlas-env
  QATLAS_DATABASE_URL: postgres://qatlas:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/qatlas?sslmode=disable
  QATLAS_BASE_URL: ${QATLAS_BASE_URL:-http://localhost:8090}
  QATLAS_MASTER_KEY: ${QATLAS_MASTER_KEY:?set QATLAS_MASTER_KEY in deploy/.env (openssl rand -base64 32)}
  QATLAS_DATA_DIR: /var/lib/qatlas
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  QATLAS_RUN_TIMEOUT: ${QATLAS_RUN_TIMEOUT:-15m}
  QATLAS_TRUST_PROXY: ${QATLAS_TRUST_PROXY:-false}
  QATLAS_LOG_LEVEL: ${QATLAS_LOG_LEVEL:-info}
  QATLAS_TZ: ${QATLAS_TZ:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: qatlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatlas -d qatlas"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  # One-shot: applies pending migrations, then exits 0. `server` and `worker`
  # wait for it, so `up -d` after an image upgrade migrates first.
  migrate:
    image: ${QATLAS_IMAGE_PREFIX:-}qatlas-server:${QATLAS_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        VERSION: ${QATLAS_VERSION:-local}
    command: ["migrate", "up"]
    restart: "no"
    environment: *qatlas-env
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  server:
    image: ${QATLAS_IMAGE_PREFIX:-}qatlas-server:${QATLAS_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        VERSION: ${QATLAS_VERSION:-local}
    command: ["server"]
    restart: unless-stopped
    environment: *qatlas-env
    ports:
      - "${QATLAS_BIND_ADDR:-0.0.0.0}:${QATLAS_HTTP_PORT:-8090}:8090"
    volumes:
      - ${QATLAS_ARTIFACTS:-artifacts}:/var/lib/qatlas
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  worker:
    image: ${QATLAS_IMAGE_PREFIX:-}qatlas-worker:${QATLAS_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        VERSION: ${QATLAS_VERSION:-local}
    command: ["worker"]
    restart: unless-stopped
    environment: *qatlas-env
    # Chromium needs a larger /dev/shm than Docker's 64 MB default; init reaps
    # orphaned browser processes.
    shm_size: ${WORKER_SHM_SIZE:-1gb}
    init: true
    volumes:
      - ${QATLAS_ARTIFACTS:-artifacts}:/var/lib/qatlas
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # Optional fake shop used by `qatlas seed demo` and the runner tests.
  # Enabled with `--profile demo`; reachable from the worker as http://demo-target:8099.
  demo-target:
    profiles: ["demo"]
    image: qatlas-demo-target:${QATLAS_VERSION:-local}
    build:
      context: ../demo-target
      dockerfile_inline: |
        FROM node:22.23.3-alpine
        WORKDIR /app
        COPY package.json server.mjs ./
        COPY public ./public
        USER node
        ENV HOST=0.0.0.0 PORT=8099
        EXPOSE 8099
        CMD ["node", "server.mjs"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEMO_TARGET_PORT:-8099}:8099"
    logging: *logging

volumes:
  pgdata:
  artifacts:
